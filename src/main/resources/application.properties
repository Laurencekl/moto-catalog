spring.application.name=moto-catalog-api

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/moto_catalog
spring.datasource.username=motocatalogapi

# Recebe a senha atual do banco pelo ambiente, sem valor fixo no arquivo.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.profiles.active=dev

# Recebe a chave JWT pelo ambiente e define validade de 15 minutos.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
